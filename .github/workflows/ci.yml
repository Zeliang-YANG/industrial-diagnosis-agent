name: agent-project-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:3306/mysql
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 毕设后端/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r 毕设后端/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s 毕设后端/tests -v
      - name: Run offline retrieval evaluation
        run: python 毕设后端/evaluate_retrieval.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 毕设前端/package-lock.json
      - name: Install frontend dependencies
        working-directory: 毕设前端
        run: npm ci
      - name: Build frontend
        working-directory: 毕设前端
        run: npm run build
      - name: Reject committed local secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)(agent_audit|.*\.pem|.*\.key)$'; then
            echo "Sensitive local file is tracked"
            exit 1
          fi
